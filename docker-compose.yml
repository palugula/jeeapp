version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: jeeapp-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: jeeapp
      MONGO_INITDB_ROOT_PASSWORD: jeeapp123
      MONGO_INITDB_DATABASE: jeeapp
    volumes:
      - mongodb_data:/data/db
    networks:
      - jeeapp-network

  mongo-express:
    image: mongo-express:latest
    container_name: jeeapp-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: jeeapp
      ME_CONFIG_MONGODB_ADMINPASSWORD: jeeapp123
      ME_CONFIG_MONGODB_URL: mongodb://jeeapp:jeeapp123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - jeeapp-network

volumes:
  mongodb_data:

networks:
  jeeapp-network:
    driver: bridge
